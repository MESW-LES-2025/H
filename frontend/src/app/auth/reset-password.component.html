<section class="auth-card">
  <h1>Reset Password</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="token">Reset token</label>
    <input id="token" formControlName="token" placeholder="Paste the token" />

    <label for="password">New password</label>
    <input
      id="password"
      type="password"
      formControlName="newPassword"
      placeholder="Minimum 8 characters"
    />
    <small *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
      Password must be at least 8 characters.
    </small>

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Updating…' : 'Reset password' }}
    </button>
  </form>

  <p class="success" *ngIf="success">{{ success }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</section>

<div class="stage">
  <div class="frame">
    <img class="hero" src="/hero.png" alt="Graduation hats" />

    <svg
      class="beige"
      viewBox="0 0 1000 700"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        d="M540,0 L1000,0 L1000,700 L540,700
               C610,610 620,500 560,430
               C500,360 495,300 560,230
               C625,160 610,70 540,0 Z"
      />
    </svg>

    <div class="panel">
      <h1 class="welcome">
        <span class="kicker">Reset Password</span>
        <span class="brandline">
          for
          <img class="brand-img" src="/lernia.png" alt="LERNIA wordmark" />
        </span>
      </h1>

      <p class="subtitle">
        Enter the token from your email and choose a new password.
      </p>

      <form [formGroup]="form" class="form" (ngSubmit)="submit()">
        <label>Reset Token</label>
        <div class="field" [class.invalid]="form.get('token')?.invalid && form.get('token')?.touched">
          <input
            formControlName="token"
            id="token"
            type="text"
            placeholder="Paste your reset token"
          />
        </div>

        <label>New Password</label>
        <div class="field has-icon" [class.invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
          <input
            formControlName="newPassword"
            id="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Minimum 8 characters"
          />
          <button
            type="button"
            class="icon"
            (click)="togglePassword()"
            aria-label="Toggle password visibility"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle *ngIf="!showPassword" cx="12" cy="12" r="3"></circle>
              <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <small class="error-hint" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
          Password must be at least 8 characters.
        </small>

        <div class="alert success" *ngIf="success">{{ success }}</div>
        <div class="alert error" *ngIf="error">{{ error }}</div>

        <button class="primary ripple" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Updating…' : 'Reset Password' }}
        </button>
      </form>

      <p class="switch">
        Remember your password?
        <a routerLink="/login" class="switch-link">Sign in</a>
      </p>

      <a routerLink="/explore" class="guest">
        Continue as guest <span class="arrow">→</span>
      </a>
    </div>
  </div>
</div>
