<header class="navbar">
  <!-- ESQUERDA: LOGO -->
  <a class="navbar-logo" routerLink="/home">
    <img src="/images/logo.png" alt="LERNIQ logo" />
  </a>

  <!-- CENTRO: LINKS -->
  <nav class="navbar-nav">
    <a
      class="nav-link"
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

  <div class="nav-dropdown" routerLinkActive="active">
    <button class="nav-link dropdown-trigger" type="button">
      Explore
      <span class="caret">⌄</span>
    </button>

    <div class="dropdown-menu">
      <a
        class="dropdown-item"
        routerLink="/explore"
        routerLinkActive="active"
      >
        Explore Universities
      </a>

      <a
        class="dropdown-item"
        routerLink="/courses"
        routerLinkActive="active"
      >
        Explore Courses
      </a>
    </div>
  </div>


    <a class="nav-link" routerLink="/faqs" routerLinkActive="active">
      FAQs
    </a>

    <a class="nav-link" routerLink="/about" routerLinkActive="active">
      About Us
    </a>
  </nav>

  <!-- DIREITA: ÍCONES -->
  <div class="navbar-actions">
    <button class="icon-btn" aria-label="Profile" (click)="goToProfile()">
      <img src="/images/profile-outline.svg" alt="" />
    </button>

    <!-- Logout Button -->
    <button *ngIf="userId" class="btn-logout" (click)="logout()">
      Log Out
    </button>
  </div>
</header>
