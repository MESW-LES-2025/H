# CI/CD Pipeline
# Automatically runs tests, builds artifacts, and triggers deployment
# when pull requests are merged into lernia-dev or iteration branches.
# Re-deployment to hosting platforms (Vercel/Render) happens automatically
# after successful merges to target branches.

name: CI Pipeline

on:
  push:
    branches:
      - lernia-dev
      - 'iteration*'
  pull_request:
    branches:
      - lernia-dev
      - 'iteration*'

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn test -Dtest='**.*Test' -U -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.count=3
        working-directory: ./backend

  backend-build:
    name: Build Java Backend
    runs-on: ubuntu-latest
    needs: backend-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend Artifact
        run: mvn -B clean package
        working-directory: ./backend

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Frontend Unit Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: ./frontend

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results || frontend/coverage || frontend/karma-results

  frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  acceptance-tests:
    name: Run Acceptance Tests
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend ]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lernia
          POSTGRES_USER: lernia
          POSTGRES_PASSWORD: lernia
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEADLESS: "true"
      APP_BASE_URL: "http://localhost:4200"
      WAIT_SECONDS: "25"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Start frontend server in background
        run: |
          npm run start &
          npx wait-on --timeout 30000 http://localhost:4200
        working-directory: ./frontend

      - name: Install Firefox + geckodriver
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox jq

          GECKO_URL=$(curl -fsSL https://api.github.com/repos/mozilla/geckodriver/releases/latest \
            | jq -r '.assets[].browser_download_url | select(endswith("linux64.tar.gz"))')

          echo "Downloading: $GECKO_URL"
          curl -fsSL "$GECKO_URL" | tar -xz
          sudo mv geckodriver /usr/local/bin/geckodriver
          sudo chmod +x /usr/local/bin/geckodriver

          which firefox
          which geckodriver
          firefox --version
          geckodriver --version

      - name: Set FIREFOX_BIN env variable
        run: |
          if [ -x /snap/firefox/current/usr/lib/firefox/firefox ]; then
            echo "FIREFOX_BIN=/snap/firefox/current/usr/lib/firefox/firefox" >> $GITHUB_ENV
          else
            echo "FIREFOX_BIN=$(which firefox)" >> $GITHUB_ENV
          fi

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Start backend server in background
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/lernia
          SPRING_DATASOURCE_USERNAME: lernia
          SPRING_DATASOURCE_PASSWORD: lernia
        run: |
          java -jar target/*.jar &
          npx wait-on --timeout 180000 http://localhost:8080/home
        working-directory: ./backend

      - name: Run acceptance tests
        run: mvn test
        working-directory: ./acceptance-tests

      - name: Stop servers
        run: |
          lsof -ti :4200 | xargs kill -9 || true
          lsof -ti :8080 | xargs kill -9 || true
