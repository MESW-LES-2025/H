# Database configuration (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lernia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lernia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lernia}
spring.datasource.driver-class-name=org.postgresql.Driver

# Server configuration
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:lernia}
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DATABASE_SCHEMA:lernia}
spring.flyway.default-schema=${DATABASE_SCHEMA:lernia}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# CORS - add your Vercel URL after deployment
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://lernia.vercel.app}

# Session cookie configuration for cross-domain support
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lernia.app.noreply@gmail.com
spring.mail.password=uhex ayxt jovk sqkc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Google OAuth2 Configuration
# Get credentials from: https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
